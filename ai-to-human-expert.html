  data.set("subject","[AI to Human] "+tool);
  data.set("message","AI to Human Expert request\nAI / GPT the text came from: "+tool+"\n\nDescription:\n"+desc);
  picked.forEach(function(file){data.append("assignmentFiles",file,file.name)});

  go.disabled=true;goTxt.textContent="Submitting\u2026";
  fetch("/api/submissions",{method:"POST",body:data,headers:{"Accept":"application/json"}})
    .then(function(r){return r.json().catch(function(){return{success:false,message:"Something went wrong. Please try again."}})})
    .then(function(j){
      if(!j.success)throw new Error(j.message||"Could not submit your request.");
      success(j,{email:ctl("email").value.trim(),tool:tool,deadline:j.deadline||(ctl("deadline_date").value+" "+ctl("deadline_time").value)});
    })
    .catch(function(e){show(e&&e.message&&e.message!=="Failed to fetch"?e.message:"Connection problem. Please check your internet and try again.");go.disabled=false;goTxt.textContent=LABEL});
});

function row(k,v){var d=document.createElement("div"),a=document.createElement("span"),b=document.createElement("b");a.textContent=k;b.textContent=v;d.appendChild(a);d.appendChild(b);return d}
function success(j,v){
  $("oid").textContent=j.orderId||"-";
  $("doneMsg").textContent="We have sent your order ID to "+v.email+". Keep it for any follow-up (check your spam folder if you do not see the email).";
  var s=$("sum");s.innerHTML="";
  s.appendChild(row("AI tool",v.tool));s.appendChild(row("Deadline",v.deadline));s.appendChild(row("Attachments",String(j.attachmentCount||0)));
  form.style.display="none";$("done").classList.add("on");$("ttl").textContent="Request received";
  window.scrollTo({top:0,behavior:"smooth"});
}
$("cp").onclick=function(){var t=$("oid").textContent,b=this;try{navigator.clipboard.writeText(t)}catch(e){}b.textContent="Copied";setTimeout(function(){b.textContent="Copy"},1600)};
$("again").onclick=function(){form.reset();picked=[];drawFiles();Array.prototype.forEach.call(form.querySelectorAll(".fld"),function(b){b.classList.remove("ok","bad")});show("");go.disabled=false;goTxt.textContent=LABEL;
  $("done").classList.remove("on");form.style.display="";$("ttl").textContent="Get 100% AI Free Expert Help";window.scrollTo({top:0,behavior:"smooth"})};
})();
