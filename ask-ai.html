      var s = document.createElement("span"), e = document.createElement("em"), x = document.createElement("button");
      s.setAttribute("role", "listitem"); e.textContent = f.name; x.type = "button"; x.textContent = "\u00D7"; x.setAttribute("aria-label", "Remove " + f.name);
      x.onclick = function () { staged.splice(i, 1); chips(); };
      s.appendChild(e); s.appendChild(x); filesEl.appendChild(s);
    });
  }
  $("attach").onclick = function () { pick.click(); };
  pick.onchange = function () {
    err.textContent = "";
    [].slice.call(pick.files || []).forEach(function (f) {
      if (staged.length >= MAXF) { err.textContent = "You can attach up to " + MAXF + " files."; return; }
      if (!OK.test(f.name)) { err.textContent = "\u201C" + f.name + "\u201D isn't a supported file type."; return; }
      if (f.size > MAXB) { err.textContent = "\u201C" + f.name + "\u201D is over 10 MB."; return; }
      staged.push(f);
    });
    pick.value = ""; chips(); sync();
  };

  /* ---- free-chat counter ---- */
  function quota(u) {
    if (!u) return;
    quotaEl.hidden = false;
    if (u.pro) { quotaEl.className = "q"; quotaEl.textContent = "Pro: unlimited chats"; return; }
    var left = Math.max(0, (u.limit || 0) - (u.used || 0));
    if (u.blocked || (u.limit && left === 0)) { quotaEl.className = "q off"; quotaEl.textContent = "Free chats finished"; }
    else if (u.limit) { quotaEl.className = "q"; quotaEl.textContent = left + " of " + u.limit + " free chats left"; }
    else quotaEl.hidden = true;
  }
  fetch("/api/chat/status", { headers: { Accept: "application/json" } }).then(function (r) { return r.json(); }).then(function (d) { if (d && d.usage) quota(d.usage); }).catch(function () {});

  function checkout(btn) {
    btn.disabled = true; var old = btn.textContent; btn.textContent = "Opening secure checkout\u2026";
    fetch("/api/billing/checkout", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" })
      .then(function (r) { return r.json().catch(function () { return {}; }); })
      .then(function (d) { if (d && d.url) { window.location.href = d.url; return; } throw new Error((d && d.message) || ""); })
      .catch(function (e) { btn.disabled = false; btn.textContent = old; err.textContent = (e && e.message) || "Checkout isn't available right now. Please try again in a moment."; });
  }

  /* ---- sending ---- */
  function sync() { send.disabled = busy || !msg.value.trim(); }
  function grow() { msg.style.height = "auto"; msg.style.height = Math.min(160, msg.scrollHeight) + "px"; }
  msg.addEventListener("input", function () { grow(); sync(); });
  msg.addEventListener("keydown", function (e) { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); if (!send.disabled) form.requestSubmit ? form.requestSubmit() : form.dispatchEvent(new Event("submit", { cancelable: true })); } });
  [].forEach.call($("quick").querySelectorAll("button"), function (b) { b.onclick = function () { msg.value = b.textContent; grow(); sync(); form.requestSubmit ? form.requestSubmit() : form.dispatchEvent(new Event("submit", { cancelable: true })); }; });

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var text = msg.value.trim(); if (!text || busy) return;
    busy = true; err.textContent = ""; send.disabled = true;
    var sending = staged.slice(), prior = history.slice(-12);
    bubble("u", text + (sending.length ? "\n\n\uD83D\uDCCE " + sending.map(function (f) { return f.name; }).join(", ") : ""));
    msg.value = ""; grow(); staged = []; chips();
    var wait = thinking();
    var fd = new FormData();
    fd.append("message", text); fd.append("history", JSON.stringify(prior));
    if (fileContext) fd.append("fileContext", fileContext);
    sending.forEach(function (f) { fd.append("files", f, f.name); });
    fetch("/api/chat", { method: "POST", body: fd, headers: { Accept: "application/json" } })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { return { ok: r.ok, status: r.status, d: d || {} }; }); })
      .then(function (r) {
        wait.remove();
        if (r.status === 402) {
          if (r.d.usage) quota(r.d.usage); else quota({ limit: 1, used: 1, blocked: true });
          var b = bubble("a", r.d.message || "Your free chats are over. Subscribe for $30/month to keep chatting.");
          var go = document.createElement("button"); go.type = "button"; go.className = "go"; go.textContent = "Subscribe: $30/month"; go.onclick = function () { checkout(go); }; b.appendChild(go);
          msg.value = text; grow(); staged = sending; chips(); return;
        }
        if (r.ok && r.d.reply) {
          history.push({ role: "user", content: text }, { role: "assistant", content: r.d.reply });
          bubble("a", r.d.reply, { footnote: r.d.notice, actions: true, q: text }); docCards(r.d.docs);
          if (typeof r.d.fileContext === "string") fileContext = r.d.fileContext;
          quota(r.d.usage); return;
        }
        bubble("a", r.d.message || "Sorry, something went wrong. Please try again in a moment.");
        msg.value = text; grow(); staged = sending; chips();
      })
      .catch(function () {
        wait.remove(); bubble("a", "Connection problem. Please check your internet and try again.");
        msg.value = text; grow(); staged = sending; chips();
      })
      .then(function () { busy = false; sync(); msg.focus(); });
  });
  sync();
})();
</script>
